name: X Play quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test && npm run lint && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - run: npm audit --omit=dev --audit-level=high
  mac-package:
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run test:native
      # Quality CI creates an artifact; releases are published separately.
      - run: npm run electron:build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Ad-hoc identity only; no certificate or signing secrets are loaded.
          CSC_FOR_PULL_REQUEST: 'true'
      - run: codesign --verify --deep --strict 'release/mac-arm64/X Play macOS.app'
      - uses: actions/upload-artifact@v4
        with:
          name: xplay-macos-arm64-candidate
          path: release/*.dmg
          retention-days: 14
